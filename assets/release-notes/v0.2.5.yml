tag: "v0.2.5"
title: "The Weekly Chronicle"

highlights:
  - "📜 **Every week now has its own thread.** Each Monday a fresh **Week N** thread opens at the Oak, and all the day's deeds are gathered there — one running log of the table's story instead of a scattered feed."
  - "✍️ **The week gets written down.** When a new week begins, the one just gone is rewritten into a short **chronicle** — the highlights of who did what, who rose, who fell — pinned for everyone to look back on."
  - "🪶 **The Warden tells a tighter tale.** The storytelling has been reworked, and a second pass now quietly checks every beat for coherence — so what you're told matches what actually happened: no phantom wounds, no triumphs narrated as defeats, fewer dropped threads."
  - "💰 **Your day-job pays you for the work.** Taking on your profession's task now drops the coin you earned straight into the result — shown in the outcome, and yours win or lose."
  - "📊 **Gear finally counts where it matters.** Your `/stats` now shows each ability's true score with the bonus from your kit broken out, and the **Mightiest** board ranks on your real, geared-up strength."
  - "📌 **The important stuff stays pinned.** Leaderboards, threats, and announcements are pinned in the channel so you can always find the latest at a glance."

notes: >
  This update is about the story you're all telling together. The week's deeds
  now live in one place and get chronicled when it closes, so the Oak remembers.
  Keep telling us what you'd love to see next.
