tag: v0.3.3
title: Stakes, Mercy & Memory
date: "2026-08-02"
highlights:
  - "🎲 Hard things are now actually hard: the ambitious approach carries real risk, and a wide gamble is finally reachable, not just harder."
  - "💸 A failure now costs something real: coin, an item, or a bruise, not just tiredness."
  - "⚔️ A won fight ends on a choice: finish the foe, or show mercy. Spare it and it lives on, wounded and remembered, not narrated as a corpse."
  - "🙋 People the story names now actually exist: meet someone new and they stay in the world, not vanish the moment the scene ends."
  - "✨ Inspiration is now rare and earned: an extra roll is a genuine reward again, not routine background noise, and honest work no longer hands one out for free."
