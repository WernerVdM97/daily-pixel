# Day jobs — loaded by /join wizard
# Performance depends on the listed stats (higher stats = better income / outcomes).
# Player picks one during character creation.
# actions: the job's pool (~8 each). /action surfaces 3 at random (job pool + COMMON_ACTIONS
#   in hi.ts — 6 shared "hybrid" actions), seeded per character per day. Keep hooks short and
#   reusable so daily repeats read well.
# base_income: daily tick income (automatic). action income: bonus for clicking.

- name: Town Guard
  emoji: "🛡️"
  depends_on: [physical]
  base_income: 10
  workplace_location: Town Square
  description: Patrol the walls. Break up tavern brawls. The town sleeps safer.
  actions:
    - label: Walk the rounds
      income: 5
      hook: You pace the streets and the wall. The town is quiet — the kind of quiet that wants watching.
    - label: Stand the gate
      income: 3
      hook: You hold the gate, marking who comes and goes. A few faces you don't know, and one you wish you didn't.
    - label: Drill with the watch
      income: 2
      hook: You put your back into the training yard until your arms burn. Steady hands keep the watch alive.
    - label: Settle a dispute
      income: 4
      hook: Raised voices spill from the tavern. Best to cool it down before it turns to fists.
    - label: Escort a traveller
      income: 5
      hook: A merchant wants company to the edge of town. The road's been uneasy of late.
    - label: Inspect the lockup
      income: 3
      hook: You check the cells. One door's hinge has been worked loose — from the inside.
    - label: Question a stranger
      income: 4
      hook: A newcomer lingers by the well, asking the wrong sort of questions about the wrong sort of things.
    - label: Guard the market
      income: 3
      hook: Pickpockets work the crowd on busy days. You keep your eyes moving and your purse closer.

- name: Blacksmith
  emoji: "🔨"
  depends_on: [physical]
  base_income: 10
  workplace_location: The Town Forge
  description: Hammer and anvil. Every town needs one. Every blade remembers your name.
  actions:
    - label: Work the forge
      income: 6
      hook: The steel glows and sings under your hammer. There's always a blade or a hinge that needs you.
    - label: Repair gear
      income: 4
      hook: A length of dented armour waits on the bench, the dent deeper than any honest accident.
    - label: Shoe a horse
      income: 3
      hook: A traveller's mount needs new shoes before the road. The rider talks too fast about the way east.
    - label: Mend tools
      income: 3
      hook: The farmers bring in worn ploughshares and cracked scythes, and the season won't wait.
    - label: Sharpen blades
      income: 4
      hook: A stack of dull edges waits by the trough — guardsmen, mostly, and all of them in a hurry.
    - label: Forge nails and fittings
      income: 3
      hook: Unglamorous work, but the carpenters pay steady coin for a good batch.
    - label: Take a commission
      income: 6
      hook: Someone wants a piece made to an unusual pattern, and won't quite say what it's for.
    - label: Bank the fire
      income: 2
      hook: Tend the coals and work the bellows. A forge is only ever as good as its heat.

- name: Hunter
  emoji: "🏹"
  depends_on: [physical, wisdom]
  base_income: 8
  workplace_location: The Forest Edge
  description: Track game in the eastern woods. The Oak's larder depends on you.
  actions:
    - label: Track game
      income: 5
      hook: You read the sign and follow it into the trees. Something bigger crossed the same trail first.
    - label: Set the trap line
      income: 4
      hook: You lay your lines where the trails cross. The old sets were sprung — bait gone, jaws clean.
    - label: Check the snares
      income: 3
      hook: Time to walk the line. One snare holds supper; another holds only a tuft of grey fur.
    - label: Dress the catch
      income: 3
      hook: Good meat for the larder and a hide for the trade — if your hands are steady and quick.
    - label: Scout the treeline
      income: 4
      hook: You read the wood's edge for what's moving in and what's moving out. Lately, more of the former.
    - label: Fish the ford
      income: 3
      hook: The crossing runs clear and cold. The silverfin are biting if you've the patience for it.
    - label: Forage the undergrowth
      income: 2
      hook: Mushrooms, berries, fallen nuts — the forest feeds those who know where to look.
    - label: Follow a blood trail
      income: 5
      hook: Something wounded passed this way. Not your arrow — but worth knowing where it went, and what stopped it.

- name: Scribe
  emoji: "📜"
  depends_on: [intelligence]
  base_income: 12
  workplace_location: The Warden's Library
  description: Copy manuscripts. Translate old tongues. The warden's library is yours.
  actions:
    - label: Copy a manuscript
      income: 6
      hook: Careful work by lamplight; every line must match. One passage isn't the nonsense it seems.
    - label: Translate a fragment
      income: 5
      hook: An old dialect, half-remembered. You puzzle it out word by word, and wish you hadn't.
    - label: Search the archive
      income: 3
      hook: Somewhere in these shelves is the answer someone's paying for — and a few they aren't.
    - label: Draft a letter
      income: 3
      hook: A villager needs words they cannot write themselves, and trusts you with the saying of them.
    - label: Catalogue the shelves
      income: 4
      hook: The collection's a mess. Order it, and you'll learn what's here — and what's gone missing.
    - label: Take dictation
      income: 4
      hook: A merchant needs his accounts set down, and talks a good deal faster than you can write.
    - label: Repair a binding
      income: 3
      hook: An old volume is shedding pages. The glue and thread are yours; the secrets are not.
    - label: Tutor a child
      income: 2
      hook: A farmer's daughter wants her letters. She learns quick, and asks harder questions than her age should allow.

- name: Herbalist
  emoji: "🌿"
  depends_on: [wisdom]
  base_income: 8
  workplace_location: The Forest Edge
  description: Gather roots and remedies. The sick come to you before the priest.
  actions:
    - label: Gather herbs
      income: 4
      hook: You walk the stream-banks for what's in season. Something trampled a wide path through the best of it.
    - label: Brew a remedy
      income: 5
      hook: Mortar and pestle, patience and care. Your hands hesitate — the symptoms don't quite sit right.
    - label: Tend a patient
      income: 3
      hook: Someone's ailing and the priest is busy. The wound is clean, but it simply won't close.
    - label: Dry and store stock
      income: 2
      hook: The drying racks need turning and the shelves restocking. Winter is always coming.
    - label: Mix a poultice
      income: 3
      hook: A field hand's burn needs dressing before it festers into something worse.
    - label: Walk the sick rounds
      income: 4
      hook: Several households are ailing this week. You make the circuit, door to door.
    - label: Prepare a tincture
      income: 5
      hook: Slow work, steeping and straining — but the apothecary in Stonebridge pays well for a clean batch.
    - label: Identify a cutting
      income: 4
      hook: Someone brings you a plant you don't recognise. It weeps a pale sap and wilts nothing nearby.

- name: Minstrel
  emoji: "🎶"
  depends_on: [charisma]
  base_income: 9
  workplace_location: The Weary Lantern Inn
  description: Play the taverns. Carry news between towns. Every song is a secret.
  actions:
    - label: Play the tavern
      income: 5
      hook: A few coins and a warm room for a good set. One man waits for the room to empty before he speaks.
    - label: Carry the news
      income: 4
      hook: Songs and stories travel faster than any rider. The word from the east has gone strangely thin.
    - label: Work on a tune
      income: 2
      hook: A melody's been turning in your head all morning — and you're not sure you're the one who wrote it.
    - label: Trade in rumours
      income: 3
      hook: Loose tongues in a loud room. You listen between the verses and keep the useful bits.
    - label: Busk in the square
      income: 4
      hook: A bright morning and a good corner. Coins for anyone who can hold a crowd until the song ends.
    - label: Perform at a gathering
      income: 5
      hook: A name-day feast wants music. The wine is free and the talk is looser than usual.
    - label: Teach a song
      income: 2
      hook: A child hums your tune back at you, half-right. Worth a coin to set it straight.
    - label: Collect a ballad
      income: 3
      hook: An old woman knows verses no one's written down. You trade her a meal for the words.

- name: Merchant
  emoji: "💰"
  depends_on: [charisma, intelligence]
  base_income: 14
  workplace_location: Town Square
  description: Buy low in Stonebridge, sell high at the Oak. Coin before creed.
  actions:
    - label: Buy stock
      income: 7
      hook: There's profit in what others undervalue. This seller won't meet your eye — he just wants it gone.
    - label: Sell wares
      income: 6
      hook: Spread the goods and talk up the quality. A hooded buyer pays in old copper, no haggling.
    - label: Strike a deal
      income: 5
      hook: A trader wants to move cargo before heading east. You want a fair cut; she wants to be gone.
    - label: Take inventory
      income: 3
      hook: Count the stock, tally the ledger. The numbers almost add up — almost.
    - label: Run the stall
      income: 5
      hook: Open early, call your wares, keep the till honest and the cutpurses nervous.
    - label: Appraise goods
      income: 4
      hook: A farmer wants to know what an heirloom's worth. Your guess is worth coin either way.
    - label: Arrange a shipment
      income: 6
      hook: Crates to move east before the roads worsen. You haggle the carter down and hope he keeps to it.
    - label: Extend credit
      income: 3
      hook: A regular's short this week. Lend wisely and you buy loyalty; lend poorly and you buy trouble.

- name: Acolyte
  emoji: "🕯️"
  depends_on: [wisdom, charisma]
  base_income: 7
  workplace_location: The Shrine of the First Flame
  description: Tend the shrine. Bless the harvest. The people need someone to believe in.
  actions:
    - label: Tend the shrine
      income: 3
      hook: Sweep the stone, trim the candles, keep the quiet. One flame will not stay snuffed.
    - label: Bless the work
      income: 4
      hook: A farmer asks a few words over the seed before sowing. The eastern field is greyer than it should be.
    - label: Counsel a villager
      income: 2
      hook: Someone carries a worry too heavy to hold alone, and a dream they keep having of the Oak.
    - label: Copy the rites
      income: 3
      hook: The old prayers must be kept legible for the next hands. Some pages are missing.
    - label: Lead a small prayer
      income: 3
      hook: A handful gather at dusk. They look to you to give the silence shape.
    - label: Visit the sick
      income: 2
      hook: The bedridden ask less for cures than for company. You give what you can.
    - label: Keep the alms
      income: 3
      hook: Sort the offerings — bread, coin, a child's carved token. Decide who needs them most.
    - label: Read the omens
      income: 4
      hook: The candle gutters east three nights running. The old book has thoughts on that.

- name: Wanderer
  emoji: "🚶"
  depends_on: [charisma]
  base_income: 2
  workplace_location:
  description: No roof, no boss, no routine. You sleep under the Oak and eat what luck brings.
  actions:
    - label: Ask for coin
      income: 3
      hook: A spot by the fountain and an honest face. A passer-by leans close with a question instead of a coin.
    - label: Sing for supper
      income: 5
      hook: A song traded for stew and a place by the fire. The traveller stops eating when you reach the chorus.
    - label: Scavenge the roadside
      income: 2
      hook: The ditches and hedges hold what others drop — broken pottery, and a glint of bent silver.
    - label: Do odd jobs
      income: 3
      hook: There's always someone needing a quick pair of hands and no questions asked.
    - label: Watch the crowd
      income: 3
      hook: A market day is a feast for a sharp eye. You note who carries coin and who carries worry.
    - label: Trade a favour
      income: 4
      hook: Someone needs a thing done quietly. You don't ask why; you ask what it pays.
    - label: Forage outside the walls
      income: 2
      hook: Beyond the gate, the hedges and ditches hold what the careless leave behind.
    - label: Tell a fortune
      income: 4
      hook: A copper and a credulous traveller. You read their face far more than any palm.
