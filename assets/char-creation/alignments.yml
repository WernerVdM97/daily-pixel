# Character alignments — loaded by /join wizard
# Rendered as a 3×3 grid of buttons

- name: Lawful Good
  emoji: "😇"
  axis: [lawful, good]
  description: Order and compassion. The code is the shield.

- name: Neutral Good
  emoji: "🕊️"
  axis: [neutral, good]
  description: Kindness above all. Rules are tools, not masters.

- name: Chaotic Good
  emoji: "🔥"
  axis: [chaotic, good]
  description: Freedom and mercy. Break the law to save the innocent.

- name: Lawful Neutral
  emoji: "📏"
  axis: [lawful, neutral]
  description: Order is its own virtue. The code, always.

- name: True Neutral
  emoji: "⚖️"
  axis: [neutral, neutral]
  description: Balance. You walk the middle road.

- name: Chaotic Neutral
  emoji: "🎲"
  axis: [chaotic, neutral]
  description: Impulse and instinct. No master, no chain.

- name: Lawful Evil
  emoji: "🗡️"
  axis: [lawful, evil]
  description: Cruelty within the rules. The system serves you.

- name: Neutral Evil
  emoji: "🐍"
  axis: [neutral, evil]
  description: Selfishness without restraint. You take what you want.

- name: Chaotic Evil
  emoji: "💀"
  axis: [chaotic, evil]
  description: Destruction for its own sake. The world burns.
