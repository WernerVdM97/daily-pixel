    - { name: Cloak, emoji: "🧥", stat: charisma, modifier: 1 }
    - {
        name: Coin Pouch,
        emoji: "👛",
        stat: charisma,
        modifier: 0,
        quantity: 5,
      }

- name: Berserker's Kit
